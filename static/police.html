<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Green Corridor · Traffic Control Room</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <link rel="stylesheet" href="/static/common.css">
  <style>
    html, body { height: 100%; }
    body { display: grid; grid-template-rows: 64px 1fr; overflow: hidden; }
    body.embed { grid-template-rows: 1fr; }
    .layout { display: grid; grid-template-columns: 460px 1fr; min-height: 0; }
    body.embed .layout { grid-template-columns: 1fr; }
    aside { background: var(--bg); border-right: 1px solid var(--border); overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; min-height: 0; }
    .mapwrap { position: relative; min-height: 0; }
    #map { position: absolute; inset: 0; }
    body.embed .mapwrap { display: none; }
    body.embed .layout { grid-template-columns: 1fr !important; grid-template-rows: 1fr !important; height: 100vh; }
    body.embed aside { padding: 10px; gap: 10px; }
    body.embed .req { gap: 9px; padding: 12px; }
    body.embed .req [data-f=sigs] { order: 9; }
    body.embed .req [data-f=why] { order: 8; }

    .status-banner { border-radius: 14px; padding: 14px 16px; font-weight: 800; font-size: 18px; display: flex; gap: 10px; align-items: center; }
    .status-banner.wait { background: var(--amber-bg); color: var(--amber); border: 2px solid var(--amber-strong); }
    .status-banner.ok { background: var(--green-bg); color: var(--green); }
    .section-title { font-size: 14px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin: 4px 0 -4px; }

    .req { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .req.ask { border: 2px solid var(--amber-strong); box-shadow: 0 0 0 4px var(--amber-bg); }
    .req-title { display: flex; gap: 12px; align-items: flex-start; }
    .req-title .ic { font-size: 30px; line-height: 1; }
    .req-title b { font-size: 19px; display: block; }
    .req-title span { color: var(--muted); font-size: 15px; }
    .facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .facts div { background: var(--surface-2); border-radius: 10px; padding: 8px 10px; text-align: center; }
    .facts b { display: block; font-size: 19px; }
    .facts span { font-size: 13px; color: var(--muted); }
    .facts .gain { background: var(--green-bg); color: var(--green); }
    .facts .gain span { color: var(--green); }
    .timer { font-size: 14px; color: var(--amber); font-weight: 700; }
    .timer .bar { height: 8px; border-radius: 4px; background: var(--amber-bg); overflow: hidden; margin-top: 6px; }
    .timer .bar div { height: 100%; background: var(--amber-strong); transition: width 1s linear; }
    .sigs { display: flex; flex-direction: column; gap: 2px; }
    .sig { display: flex; align-items: center; gap: 10px; font-size: 15px; padding: 5px 0; }
    .sig .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .sig .what { color: var(--muted); font-size: 14px; white-space: nowrap; }
    .sig input { width: 22px; height: 22px; accent-color: var(--green-strong); }
    .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chips button { min-height: 46px; padding: 0 14px; border-radius: 23px; border: 2px solid var(--red-strong); background: var(--surface);
                    font-family: inherit; font-weight: 600; font-size: 15px; color: var(--red); cursor: pointer; }
    .progress { height: 8px; background: var(--surface-3); border-radius: 4px; overflow: hidden; }
    .progress div { height: 100%; background: var(--corridor); transition: width .9s linear; }
    .answers { background: var(--surface-2); border-radius: 10px; padding: 8px 12px; font-size: 14px; }
    .settings { font-size: 14px; color: var(--muted); display: flex; flex-direction: column; gap: 8px; }
    .settings label { display: flex; gap: 8px; align-items: center; }
    @media (max-width: 900px) { body { overflow: auto; grid-template-rows: 64px auto; } .layout { grid-template-columns: 1fr !important; grid-template-rows: 45vh auto; }
      .mapwrap { order: -1; } }
  </style>
</head>
<body>
<div id="topbar"></div>
<div class="layout">
  <aside id="aside">
    <div id="tips"></div>
    <div class="status-banner ok" id="banner">✓ No ambulance is waiting for you</div>
    <div class="section-title" id="t-ask" hidden>Needs your answer</div>
    <div class="stack" id="ask"></div>
    <div class="section-title" id="t-road" hidden>Ambulances on the road</div>
    <div class="stack" id="road"></div>
    <details id="done-box" hidden><summary class="section-title" style="cursor:pointer">Finished</summary><div class="stack" id="done" style="margin-top:12px"></div></details>
    <div class="settings" id="settings">
      <label><input type="checkbox" id="sound"> 🔔 Ring when a new ambulance asks</label>
      <label><input type="checkbox" id="auto"> Practice mode: say yes to every request automatically</label>
    </div>
  </aside>
  <div class="mapwrap"><div id="map"></div></div>
</div>

<script src="/static/common.js"></script>
<script>
  if (EMBED) { document.body.classList.add('embed'); $('settings').remove(); }
  let officer = remember.get('gc-control-officer') || 'Control room';
  topbar($('topbar'), 'Traffic control room', `<label class="small muted" for="officer">Your name</label>
    <input type="text" id="officer" style="width:200px;min-height:44px" value="${escapeHtml(officer)}">`);
  $('officer')?.addEventListener('change', (e) => { officer = e.target.value || 'Control room'; remember.set('gc-control-officer', officer); });
  tip($('tips'), 'police-start', 'When an ambulance asks for a clear road, it appears here in <b>orange</b>. Press <b>Yes, clear the road</b> to turn its signals green as it arrives. If you do not answer in 60 seconds, the ambulance drives in normal traffic.');

  const map = L.map('map', { maxZoom: 19 }).setView([12.975, 77.62], 12);
  addBaseMap(map);
  if (!EMBED) makeResizableSidebar(document.querySelector('.layout'), $('aside'), map, 'gc-side-police', { side: 'left', min: 380, max: 680 });

  let state = null, fitted = false;
  const cards = new Map();       // leg id -> card
  const layers = new Map();      // leg id -> map layers
  const ambMarkers = new Map();
  const seen = new Set(), autoDone = new Set();

  // ---------- sound for new requests ----------
  let audio = null;
  $('sound')?.addEventListener('change', (e) => { if (e.target.checked) { audio = audio || new AudioContext(); ring(1); } });
  function ring(times = 2) {
    if (!audio || !$('sound')?.checked) return;
    for (let i = 0; i < times; i++) [740, 980].forEach((f, j) => {
      const o = audio.createOscillator(), g = audio.createGain();
      o.frequency.value = f; o.connect(g); g.connect(audio.destination);
      const tt = audio.currentTime + i * 0.5 + j * 0.2;
      g.gain.setValueAtTime(0.2, tt); g.gain.exponentialRampToValueAtTime(0.001, tt + 0.18);
      o.start(tt); o.stop(tt + 0.2);
    });
  }

  async function decide(leg, decision, declined = [], note = null) {
    try {
      await api(`/api/legs/${leg.id}/clearance`, { decision, declined_signals: declined, note, officer });
      toast(decision === 'declined' ? 'The driver has been told the road could not be cleared.' : '✓ Done. Signals will turn green as the ambulance arrives.', decision === 'declined' ? '' : 'good');
      refresh();
    } catch (e) { toast(e.message, 'bad'); }
  }

  // ---------- cards ----------
  const where = (inc, leg) => leg.kind === 'to_scene' ? `Going to an accident${inc.description ? ': ' + inc.description : ''}` : `Taking a patient to ${leg.destination.name}`;

  function askCard(inc, leg) {
    const el = document.createElement('div');
    el.className = 'card req ask';
    el.dataset.mode = 'ask';
    el.innerHTML = `
      <div class="req-title"><span class="ic">🚑</span><div><b>${escapeHtml(inc.ambulance.callsign)} needs a clear road</b><span>${escapeHtml(where(inc, leg))}</span></div></div>
      <div class="facts" data-f="facts"></div>
      <div class="timer" data-f="timer"></div>
      <div class="sigs" data-f="sigs"></div>
      <button class="btn go huge" data-act="yes">✓ Yes, clear the road</button>
      <div class="two"><button class="btn" data-act="choose">Choose signals</button><button class="btn stop" data-act="no">✕ Not possible</button></div>
      <div data-f="why" hidden><p style="margin:0 0 8px"><b>Why not?</b> Tap one:</p>
        <div class="chips">${['VIP movement', 'Road works', 'Traffic jam', 'Not enough staff'].map(r => `<button data-r="${r}">${r}</button>`).join('')}</div></div>`;
    const n = leg.signals.length;
    el.querySelector('[data-act=yes]').textContent = `✓ Yes, clear the road (${n} signal${n === 1 ? '' : 's'})`;
    el.querySelector('[data-act=yes]').addEventListener('click', () => {
      if (el.dataset.mode === 'choose') {  // clear only the ticked signals
        const declined = [...el.querySelectorAll('[data-f=sigs] input:not(:checked)')].map(i => Number(i.value));
        decide(leg, declined.length ? 'partial' : 'approved', declined);
      } else decide(leg, 'approved');
    });
    el.querySelector('[data-act=choose]').addEventListener('click', () => {
      el.dataset.mode = el.dataset.mode === 'choose' ? 'ask' : 'choose';
      el.querySelector('[data-act=choose]').textContent = el.dataset.mode === 'choose' ? 'Clear all instead' : 'Choose signals';
      el.querySelector('[data-act=yes]').textContent = el.dataset.mode === 'choose' ? '✓ Clear the ticked signals' : `✓ Yes, clear the road (${n} signal${n === 1 ? '' : 's'})`;
      el.dataset.drawn = '';
      updateAsk(el, inc, leg);
    });
    el.querySelector('[data-act=no]').addEventListener('click', () => { el.querySelector('[data-f=why]').hidden = false; });
    el.querySelectorAll('[data-r]').forEach(b => b.addEventListener('click', () => decide(leg, 'declined', [], b.dataset.r)));
    el.addEventListener('mouseenter', () => focusLeg(leg.id));
    return el;
  }

  function updateAsk(el, inc, leg) {
    const f = (n) => el.querySelector(`[data-f=${n}]`);
    const saves = Math.max(0, leg.plan.normal_s - leg.plan.corridor_s);
    f('facts').innerHTML = `<div><b>${fmtKm(leg.distance_m)}</b><span>to drive</span></div><div><b>${leg.signals.length}</b><span>signals</span></div>
      <div class="gain"><b>~${fmtMin(saves)} min</b><span>faster if cleared</span></div>`;
    const left = leg.clearance.expires_in_s ?? 0;
    f('timer').innerHTML = `⏱ Please answer within ${left} seconds. The ambulance is already moving.<div class="bar"><div style="width:${100 * left / 60}%"></div></div>`;
    if (el.dataset.drawn !== '1') {  // signal list: drawn once, so tick boxes keep their state
      el.dataset.drawn = '1';
      const choose = el.dataset.mode === 'choose';
      const list = leg.signals.slice(0, choose ? 99 : 4);
      f('sigs').innerHTML = (choose ? '<p class="small muted" style="margin:0 0 4px">Untick the signals you cannot clear:</p>' : '<p class="small muted" style="margin:0 0 4px">Signals on its road:</p>') +
        list.map(s => `<label class="sig">${choose ? `<input type="checkbox" value="${s.id}" checked>` : '<span class="dot wait"></span>'}
          <span class="name">${escapeHtml(junctionName(s))}</span><span class="what">in ${fmtMin(s.eta_s)} min</span></label>`).join('') +
        (!choose && leg.signals.length > 4 ? `<p class="small muted" style="margin:4px 0 0">and ${leg.signals.length - 4} more</p>` : '');
    }
  }

  function roadCard(inc, leg) {
    const el = document.createElement('div');
    el.className = 'card req';
    el.innerHTML = `
      <div class="req-title"><span class="ic">🚑</span><div class="grow"><b>${escapeHtml(inc.ambulance.callsign)} · arrives in <span data-f="eta" style="display:inline;font-size:inherit;color:inherit"></span></b>
        <span>${escapeHtml(where(inc, leg))}</span></div></div>
      <span class="pill" data-f="pill" style="align-self:flex-start"></span>
      <div class="progress"><div data-f="bar"></div></div>
      <div class="sigs" data-f="sigs"></div>
      <div class="answers" data-f="answers" hidden></div>
      <div class="row" data-f="acts"></div>`;
    el.addEventListener('mouseenter', () => focusLeg(leg.id));
    return el;
  }

  function updateRoad(el, inc, leg) {
    const f = (n) => el.querySelector(`[data-f=${n}]`);
    const pol = POLICE[leg.clearance.status];
    f('eta').textContent = `${fmtMin(leg.eta_s)} min`;
    f('pill').className = 'pill ' + pol.kind;
    f('pill').textContent = `${pol.kind === 'ok' ? '✓' : '✕'} ${pol.text}${leg.clearance.note ? ' · ' + leg.clearance.note : ''}`;
    f('bar').style.width = (100 * leg.progress).toFixed(1) + '%';
    const ahead = leg.signals.filter(s => s.state !== 'passed').slice(0, 4);
    f('sigs').innerHTML = ahead.map(s => `<div class="sig"><span class="dot ${SIGNAL[s.state].kind}"></span><span class="name">${escapeHtml(junctionName(s))}</span>
      <span class="what">${SIGNAL[s.state].text}${s.answered_by ? ' · ' + escapeHtml(s.answered_by) : ''} · ${fmtMin(s.eta_s)} min</span></div>`).join('') ||
      '<p class="small muted" style="margin:0">All signals passed.</p>';
    const cant = leg.signals.filter(s => s.answer === 'cant');
    f('answers').hidden = !cant.length;
    f('answers').innerHTML = cant.map(s => `✕ <b>${escapeHtml(s.answered_by || 'Officer')}</b> at ${escapeHtml(junctionName(s))} can't clear${s.reason ? ': ' + escapeHtml(s.reason) : ''}`).join('<br>');
    const on = pol.kind === 'ok';
    const want = on ? 'on' : 'off';
    if (f('acts').dataset.state !== want) {
      f('acts').dataset.state = want;
      f('acts').innerHTML = on ? `<button class="btn small stop">Stop clearing</button>` : `<button class="btn small go">Clear it now</button>`;
      f('acts').querySelector('button').addEventListener('click', () => on
        ? (confirm('Stop clearing the road for this ambulance?') && decide(leg, 'declined', [], 'Clearing stopped'))
        : decide(leg, 'approved', [], 'Cleared later'));
    }
  }

  // ---------- map ----------
  function focusLeg(id) {
    const lay = layers.get(id);
    if (lay?.line && !EMBED) map.fitBounds(lay.line.getBounds().pad(0.25));
  }

  function drawMap() {
    const legs = new Set();
    const active = state.incidents.filter(i => i.status === 'active');
    for (const inc of active) {
      const leg = inc.current_leg, a = inc.ambulance;
      let m = ambMarkers.get(a.id);
      if (!m) { m = L.marker([a.lat, a.lon], { icon: ambIcon(a.callsign), zIndexOffset: 3000 }).addTo(map); ambMarkers.set(a.id, m); }
      else glide(m, [a.lat, a.lon]);
      if (!leg || leg.done) continue;
      legs.add(leg.id);
      let lay = layers.get(leg.id);
      if (!lay) {
        lay = { group: L.layerGroup().addTo(map), signals: [] };
        layers.set(leg.id, lay);
        L.marker([inc.scene.lat, inc.scene.lon], { icon: sceneIcon() }).addTo(lay.group);
        legGeometry(inc.id, leg.id).then(geo => {
          L.polyline(geo.coords, { color: '#fff', weight: 10, opacity: .9, interactive: false }).addTo(lay.group);
          lay.line = L.polyline(geo.coords, { weight: 6, interactive: false }).addTo(lay.group);
          lay.signals = leg.signals.map(s => L.circleMarker([s.lat, s.lon], { radius: 7, weight: 3, color: '#fff', fillOpacity: 1 })
            .bindTooltip(`🚦 ${escapeHtml(junctionName(s))}`).addTo(lay.group));
          if (!fitted) { fitted = true; setTimeout(fitAll, 600); }
        });
      }
      lay.line?.setStyle(routeStyle(leg.clearance.status));
      leg.signals.forEach((s, i) => lay.signals[i]?.setStyle({ fillColor: signalColor(s.state), radius: s.state === 'held' ? 9 : 7,
        opacity: s.state === 'passed' ? .4 : 1, fillOpacity: s.state === 'passed' ? .4 : 1 }));
    }
    for (const [id, lay] of layers) if (!legs.has(id)) { lay.group.remove(); layers.delete(id); }
    const ambIds = new Set(active.map(i => i.ambulance.id));
    for (const [id, m] of ambMarkers) if (!ambIds.has(id)) { m.remove(); ambMarkers.delete(id); }
  }
  function fitAll() {
    const pts = [...layers.values()].flatMap(l => l.line ? l.line.getLatLngs() : []);
    if (pts.length) map.fitBounds(L.latLngBounds(pts).pad(0.15));
  }

  // ---------- polling ----------
  async function refresh() {
    try { state = await api('/api/state'); } catch (e) { return; }
    const ask = [], road = [];
    for (const inc of state.incidents.filter(i => i.status === 'active')) {
      const leg = inc.current_leg;
      if (!leg || leg.done) continue;
      (leg.clearance.status === 'pending' ? ask : road).push([inc, leg]);
      if (leg.clearance.status === 'pending' && $('auto')?.checked && !autoDone.has(leg.id)) {
        autoDone.add(leg.id);
        setTimeout(() => decide(leg, 'approved', [], 'Practice mode: automatic yes'), 1500);
      }
    }
    const place = (box, items, make, update, prefix) => {
      const keep = [];
      for (const [inc, leg] of items) {
        const key = prefix + leg.id;
        if (!cards.has(key)) {
          cards.set(key, make(inc, leg));
          if (prefix === 'ask-' && !seen.has(key)) { seen.add(key); ring(2); }
        }
        update(cards.get(key), inc, leg);
        box.appendChild(cards.get(key));
        keep.push(cards.get(key));
      }
      [...box.children].forEach(ch => { if (!keep.includes(ch)) ch.remove(); });
    };
    place($('ask'), ask, askCard, updateAsk, 'ask-');
    place($('road'), road, roadCard, updateRoad, 'road-');
    $('t-ask').hidden = !ask.length; $('t-road').hidden = !road.length;
    $('banner').className = 'status-banner ' + (ask.length ? 'wait' : 'ok');
    $('banner').textContent = ask.length ? `🚨 ${ask.length} ambulance${ask.length > 1 ? 's need' : ' needs'} your answer` :
      road.length ? `✓ All answered · ${road.length} ambulance${road.length > 1 ? 's' : ''} on the road` : '✓ No ambulance is waiting for you';
    document.title = (ask.length ? `(${ask.length}) ` : '') + 'Green Corridor · Traffic Control Room';
    const done = state.incidents.filter(i => i.status !== 'active').slice(0, 5);
    $('done-box').hidden = !done.length || EMBED;
    $('done').innerHTML = done.map(inc => `<div class="card flat" style="padding:12px 14px"><b>${escapeHtml(inc.ambulance.callsign)}</b>
      <span class="muted"> · ${inc.status === 'closed' ? 'patient reached hospital' : 'cancelled'} · ${escapeHtml(inc.description || '')}</span></div>`).join('');
    if (!EMBED) drawMap();
  }
  refresh();
  setInterval(refresh, 1000);
</script>
</body>
</html>
