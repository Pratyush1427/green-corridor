<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bengaluru Traffic Tracker</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg: #f7f7f5; --panel: #ffffff; --text: #1f2328; --muted: #6b7280; --border: #e5e7eb;
      --green: #16a34a; --amber: #d97706; --red: #dc2626; --grey: #9ca3af; --accent: #2563eb;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; font-family: system-ui, -apple-system, sans-serif;
                 background: var(--bg); color: var(--text); }
    .layout { display: grid; grid-template-columns: 1fr 380px; height: 100vh; }
    #map { height: 100%; }
    aside { background: var(--panel); border-left: 1px solid var(--border); padding: 20px;
            overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }
    h1 { font-size: 18px; margin: 0; }
    h2 { font-size: 16px; margin: 0; }
    .muted { color: var(--muted); font-size: 13px; }
    .legend { display: flex; gap: 14px; font-size: 13px; flex-wrap: wrap; }
    .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; }
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .stat { border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; }
    .stat b { display: block; font-size: 18px; font-variant-numeric: tabular-nums; }
    .stat span { font-size: 12px; color: var(--muted); }
    select { font: inherit; padding: 6px 8px; border: 1px solid var(--border); border-radius: 6px;
             background: var(--panel); color: var(--text); }
    .chart-wrap { position: relative; height: 240px; }
    #detail[hidden] { display: none; }
    @media (max-width: 800px) {
      .layout { grid-template-columns: 1fr; grid-template-rows: 55vh auto; height: auto; }
      #map { height: 55vh; }
      aside { border-left: none; border-top: 1px solid var(--border); padding: 16px; }
    }
  </style>
</head>
<body>
<div class="layout">
  <div id="map"></div>
  <aside>
    <div>
      <h1>Bengaluru Traffic Tracker</h1>
      <div class="muted" id="updated">Loading…</div>
    </div>
    <div class="legend">
      <span><span class="dot" style="background:var(--green)"></span>Clear (&lt;30%)</span>
      <span><span class="dot" style="background:var(--amber)"></span>Slow (30–60%)</span>
      <span><span class="dot" style="background:var(--red)"></span>Jammed (&gt;60%)</span>
      <span><span class="dot" style="background:var(--grey)"></span>No data</span>
    </div>
    <p class="muted" id="hint">Click a junction on the map to see its typical pattern by hour of day.</p>

    <section id="detail" hidden>
      <h2 id="j-name"></h2>
      <div class="muted" id="j-time"></div>
      <div class="stats" style="margin-top:10px">
        <div class="stat"><b id="j-cong">–</b><span>Congestion now</span></div>
        <div class="stat"><b id="j-speed">–</b><span>Speed / free flow (km/h)</span></div>
      </div>
      <div style="margin:14px 0 8px; display:flex; align-items:center; gap:8px">
        <label for="weekday" class="muted">Pattern for</label>
        <select id="weekday">
          <option value="">All days</option>
          <option value="0">Monday</option><option value="1">Tuesday</option>
          <option value="2">Wednesday</option><option value="3">Thursday</option>
          <option value="4">Friday</option><option value="5">Saturday</option>
          <option value="6">Sunday</option>
        </select>
      </div>
      <div class="chart-wrap"><canvas id="chart"></canvas></div>
      <div class="muted" id="j-samples" style="margin-top:6px"></div>
    </section>
  </aside>
</div>

<script>
  const REFRESH_MS = 60 * 1000;
  const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

  function colorFor(congestion) {
    if (congestion == null) return css('--grey');
    if (congestion < 0.3) return css('--green');
    if (congestion < 0.6) return css('--amber');
    return css('--red');
  }
  const pct = (x) => x == null ? '–' : Math.round(x * 100) + '%';
  const istTime = (tsUtc) => new Date(tsUtc.replace(' ', 'T') + 'Z')
    .toLocaleString('en-IN', { timeZone: 'Asia/Kolkata', dateStyle: 'medium', timeStyle: 'short' });

  const map = L.map('map').setView([12.975, 77.63], 12);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19, attribution: '&copy; OpenStreetMap contributors',
  }).addTo(map);

  const markers = {};
  let junctions = {};
  let selectedId = null;
  let chart = null;

  async function loadJunctions() {
    try {
      const data = await (await fetch('/api/junctions')).json();
      junctions = Object.fromEntries(data.map(j => [j.id, j]));
      for (const j of data) {
        const c = j.latest ? j.latest.congestion : null;
        const style = { radius: 11, weight: 2, color: '#fff', fillColor: colorFor(c), fillOpacity: 0.9 };
        if (!markers[j.id]) {
          markers[j.id] = L.circleMarker([j.lat, j.lon], style).addTo(map)
            .on('click', () => selectJunction(j.id));
        } else {
          markers[j.id].setStyle(style);
        }
        markers[j.id].bindTooltip(`${j.name}: ${pct(c)}`);
      }
      document.getElementById('updated').textContent =
        'Page refreshed ' + new Date().toLocaleTimeString('en-IN') + ' · auto-refresh every 60s';
      if (selectedId) renderDetail();
    } catch (e) {
      document.getElementById('updated').textContent = 'Could not load data: ' + e.message;
    }
  }

  function renderDetail() {
    const j = junctions[selectedId];
    document.getElementById('detail').hidden = false;
    document.getElementById('hint').hidden = true;
    document.getElementById('j-name').textContent = j.name;
    const r = j.latest;
    document.getElementById('j-time').textContent = r ? 'Latest reading ' + istTime(r.ts_utc) + ' IST' : 'No readings yet';
    const cong = document.getElementById('j-cong');
    cong.textContent = r ? pct(r.congestion) : '–';
    cong.style.color = r ? colorFor(r.congestion) : '';
    document.getElementById('j-speed').textContent = r ? `${r.current_speed} / ${r.free_flow_speed}` : '–';
  }

  async function loadPattern() {
    if (!selectedId) return;
    const wd = document.getElementById('weekday').value;
    const url = `/api/patterns/${selectedId}` + (wd === '' ? '' : `?weekday=${wd}`);
    const data = await (await fetch(url)).json();
    const values = data.hours.map(h => h.congestion == null ? null : Math.round(h.congestion * 100));
    const samples = data.hours.reduce((s, h) => s + h.samples, 0);
    document.getElementById('j-samples').textContent = `Based on ${samples} readings (hours in IST)`;

    const cfg = {
      type: 'line',
      data: {
        labels: data.hours.map(h => String(h.hour).padStart(2, '0')),
        datasets: [{
          label: 'Avg congestion %', data: values, spanGaps: true, tension: 0.3,
          borderColor: css('--accent'), backgroundColor: css('--accent') + '22', fill: true,
          pointRadius: 2, borderWidth: 2,
        }],
      },
      options: {
        maintainAspectRatio: false,
        plugins: { legend: { display: false },
                   tooltip: { callbacks: { title: (it) => it[0].label + ':00 IST', label: (it) => it.formattedValue + '% congested' } } },
        scales: {
          y: { min: 0, max: 100, ticks: { callback: (v) => v + '%' } },
          x: { title: { display: true, text: 'Hour of day (IST)' } },
        },
      },
    };
    if (chart) { chart.data = cfg.data; chart.update(); }
    else { chart = new Chart(document.getElementById('chart'), cfg); }
  }

  function selectJunction(id) {
    selectedId = id;
    renderDetail();
    loadPattern();
  }

  document.getElementById('weekday').addEventListener('change', loadPattern);
  loadJunctions();
  setInterval(() => { loadJunctions(); loadPattern(); }, REFRESH_MS);
</script>
</body>
</html>
